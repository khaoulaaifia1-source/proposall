<!DOCTYPE html>
<html>
<head>
  <title>For Sinda ❤️</title>

  <style>
    body {
      margin: 0;
      height: 100vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      font-family: Arial, sans-serif;
    }

    .card {
      text-align: center;
      background: white;
      padding: 40px;
      border-radius: 25px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }

    h1 {
      color: #e60073;
      font-size: 40px;
    }

    p {
      font-size: 22px;
    }

    button {
      padding: 15px 30px;
      font-size: 20px;
      border: none;
      border-radius: 15px;
      cursor: pointer;
      margin: 10px;
    }

    #yes {
      background: #ff2e63;
      color: white;
    }

    #no {
      background: black;
      color: white;
      position: absolute;
    }
  </style>
</head>

<body>

<div class="card">
  <h1>Sinda Nahali ❤️</h1>
  <p>Would you marry me next year? 💍</p>

  <button id="yes" onclick="yesClick()">Yes ❤️</button>
  <button id="no" onmouseover="moveButton()">No 😅</button>
</div>

<script>
function yesClick() {
  alert("❤️ Best decision ever ❤️");
}

function moveButton() {
  const button = document.getElementById("no");

  const maxX = window.innerWidth - 100;
  const maxY = window.innerHeight - 50;

  const x = Math.random() * maxX;
  const y = Math.random() * maxY;

  button.style.left = x + "px";
  button.style.top = y + "px";
}
</script>

</body>
</html>
