<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pour toi ❤️</title>

  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #ffd6e7, #fff0f5);
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    .card {
      background: white;
      padding: 40px;
      border-radius: 25px;
      text-align: center;
      box-shadow: 0 10px 40px rgba(0,0,0,.15);
      max-width: 500px;
    }

    h1 {
      color: #e91e63;
      font-size: 36px;
    }

    p {
      font-size: 22px;
      color: #444;
    }

    .buttons {
      margin-top: 30px;
      display: flex;
      justify-content: center;
      gap: 20px;
    }

    button {
      border: none;
      padding: 14px 28px;
      border-radius: 30px;
      font-size: 18px;
      cursor: pointer;
    }

    #yes {
      background: #e91e63;
      color: white;
    }

    #no {
      background: #ddd;
      color: #333;
      position: fixed;
    }

    #message {
      display: none;
      font-size: 28px;
      color: #e91e63;
      margin-top: 25px;
    }
  </style>
</head>

<body>

  <div class="card">
    <h1>Je t'aime ❤️</h1>

    <p>
      Je viens te supporter pendant la garde ? 🥹❤️
    </p>

    <div class="buttons">
      <button id="yes">Oui ❤️</button>
      <button id="no">Non 😏</button>
    </div>

    <div id="message">
      Je savais que tu dirais oui ! 😌❤️
    </div>
  </div>

  <script>
    const noButton = document.getElementById("no");
    const yesButton = document.getElementById("yes");
    const message = document.getElementById("message");

    function escape() {
      const margin = 20;

      const maxX = window.innerWidth - noButton.offsetWidth - margin;
      const maxY = window.innerHeight - noButton.offsetHeight - margin;

      const x = Math.random() * maxX + margin;
      const y = Math.random() * maxY + margin;

      noButton.style.left = x + "px";
      noButton.style.top = y + "px";
    }

    // Le bouton s'enfuit avant même qu'on puisse cliquer dessus
    noButton.addEventListener("mouseenter", escape);
    noButton.addEventListener("touchstart", escape);

    yesButton.addEventListener("click", () => {
      message.style.display = "block";
      yesButton.style.display = "none";
      noButton.style.display = "none";
    });
  </script>

</body>
</html>
